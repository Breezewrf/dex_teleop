    - R_index_tip
    - R_middle_tip
    - R_ring_tip
    - R_pinky_tip
    - R_middle_tip
    - R_ring_tip
    - R_pinky_tip
    - R_ring_tip
    - R_pinky_tip
    - R_pinky_tip

  target_link_human_indices_vector:
    - [0, 1, 2, 3, 0, 6, 7, 8, 0, 11, 12, 13, 0, 16, 17, 18, 0, 21, 22, 23, 4, 4, 4, 4, 9, 9, 9, 14, 14, 19]
    - [1, 2, 3, 4, 6, 7, 8, 9, 11, 12, 13, 14, 16, 17, 18, 19, 21, 22, 23, 24, 9, 14, 19, 24, 14, 19, 24, 19, 24, 24]

  scaling_factor: 1.2
  low_pass_alpha: 0.2
